version: 1

services:
  chat-api:
    type: service
    build:
      type: dockerfile
      dockerfile: Dockerfile
      context: .
    ports:
      - port: 8000
        protocol: http
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - ENVIRONMENT=production
    healthcheck:
      path: /health
      interval: 30
      timeout: 10
      retries: 3
    resources:
      cpu: 1000
      memory: 1024
    scaling:
      min: 1
      max: 3

databases:
  postgres:
    type: postgresql
    version: "15"
    resources:
      cpu: 500
      memory: 512
    backups:
      enabled: true
      schedule: "0 2 * * *"  # Daily at 2 AM

caches:
  redis:
    type: redis
    version: "7"
    resources:
      cpu: 250
      memory: 256

